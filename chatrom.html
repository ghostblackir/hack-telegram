<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت روم ناشناس</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Vazirmatn, sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 15px;
            text-align: center;
            font-size: 20px;
            background: #1c1c1c;
            font-weight: bold;
        }

        #chatContainer {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message {
            background: #222;
            padding: 10px 12px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.3s;
        }

        .message.self {
            background: #00f4ff;
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        #inputContainer {
            display: flex;
            padding: 10px;
            background: #1c1c1c;
            gap: 8px;
        }

        #text {
            flex: 1;
            padding: 10px;
            border-radius: 18px;
            border: none;
            font-size: 16px;
        }

        #sendBtn {
            padding: 10px 16px;
            border: none;
            border-radius: 18px;
            background: #00f4ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        #sendBtn:hover {
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @media(max-width:400px) {
            header {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <header>چت روم ناشناس</header>

    <div id="chatContainer"></div>

    <div id="inputContainer">
        <input type="text" id="text" placeholder="پیام خود را بنویسید">
        <button id="sendBtn">ارسال</button>
    </div>

    <script>
        // پیکربندی Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCOL8YHwIe3OCCeJcZnb03Gsqf3e290QL0",
            authDomain: "ghost-2add0.firebaseapp.com",
            projectId: "ghost-2add0",
            storageBucket: "ghost-2add0.appspot.com",
            messagingSenderId: "765160111148",
            appId: "1:765160111148:web:51b3ccb5d26a6cb1cfe589",
            measurementId: "G-P5KH7K9D48"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const chatContainer = document.getElementById('chatContainer');
        const textInput = document.getElementById('text');
        const sendBtn = document.getElementById('sendBtn');

        // نام ناشناس کاربر
        let userName = localStorage.getItem('anonName');
        if (!userName) {
            db.collection('counters').doc('userCounter').get().then(doc => {
                let count = doc.exists ? doc.data().count + 1 : 1;
                userName = 'zed ' + count;
                localStorage.setItem('anonName', userName);
                db.collection('counters').doc('userCounter').set({ count });
            });
        }

        // ارسال پیام
        sendBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) return;
            db.collection('messages').add({
                name: userName, text, timestamp: Date.now()
            });
            textInput.value = '';
        });

        // نمایش پیام‌ها زنده
        db.collection('messages').orderBy('timestamp').onSnapshot(snapshot => {
            chatContainer.innerHTML = '';
            snapshot.forEach(doc => {
                const msg = doc.data();
                const div = document.createElement('div');
                div.className = 'message';
                if (msg.name === userName) div.classList.add('self');
                div.innerHTML = `<strong>${msg.name}:</strong> ${msg.text}`;
                chatContainer.appendChild(div);
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        // نمایش پیام‌ها زنده
        db.collection('messages').orderBy('timestamp').onSnapshot(snapshot => {
            chatContainer.innerHTML = '';
            snapshot.forEach(doc => {
                const msg = doc.data();
                const div = document.createElement('div');
                div.className = 'message';
                if (msg.name === userName) div.classList.add('self');

                div.innerHTML = `<strong>${msg.name}:</strong> <span class="text">${msg.text}</span>`;

                // اگر پیام خود کاربر است، دکمه سه نقطه اضافه شود
                if (msg.name === userName) {
                    const menuBtn = document.createElement('button');
                    menuBtn.textContent = '⋮';
                    menuBtn.style.float = 'left';
                    menuBtn.style.background = 'transparent';
                    menuBtn.style.border = 'none';
                    menuBtn.style.color = '#fff';
                    menuBtn.style.cursor = 'pointer';
                    menuBtn.style.marginLeft = '8px';
                    div.appendChild(menuBtn);

                    const menu = document.createElement('div');
                    menu.style.position = 'absolute';
                    menu.style.background = '#333';
                    menu.style.padding = '5px';
                    menu.style.borderRadius = '8px';
                    menu.style.display = 'none';
                    menu.innerHTML = '<div class="edit" style="cursor:pointer;padding:5px;">ویرایش</div><div class="delete" style="cursor:pointer;padding:5px;">حذف</div>';
                    div.appendChild(menu);

                    menuBtn.addEventListener('click', () => { menu.style.display = menu.style.display === 'none' ? 'block' : 'none'; });

                    // حذف پیام
                    menu.querySelector('.delete').addEventListener('click', () => {
                        db.collection('messages').doc(doc.id).delete();
                    });

                    // ویرایش پیام
                    menu.querySelector('.edit').addEventListener('click', () => {
                        const newText = prompt('متن جدید را وارد کنید:', msg.text);
                        if (newText) db.collection('messages').doc(doc.id).update({ text: newText });
                        menu.style.display = 'none';
                    });
                }

                chatContainer.appendChild(div);
            });
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

    </script>

</body>

</html>

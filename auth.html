<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHOST AUTH SYSTEMS</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #121212;
      --text: #e6e6e6;
      --accent: #00f4ff;
      --accent-2: #00ff95;
      --muted: #9aa0a6;
      --danger: #ff5252;
      --border: #00f4ff33;
    }

    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #050505;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .auth-page-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-box.panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px 25px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 40px rgba(0, 244, 255, 0.15);
      box-sizing: border-box;
      position: relative;
    }

    .auth-box h2 {
      text-align: center;
      color: var(--accent);
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .field {
      position: relative;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #00000055;
      color: var(--text);
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
      transition: all 0.25s ease;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 244, 255, 0.4);
      background: #00000088;
    }

    .btn {
      background: var(--accent);
      color: #032d2f;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;
      transition: transform .12s ease, filter .2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: saturate(1.2);
      box-shadow: 0 0 15px rgba(0, 244, 255, 0.4);
    }

    .google-btn {
      background: transparent !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      margin-top: 12px;
    }

    .google-btn:hover {
      background: rgba(0, 244, 255, 0.08) !important;
      box-shadow: 0 0 15px rgba(0, 244, 255, 0.2) !important;
    }

    .google-btn img {
      width: 18px;
      height: 18px;
    }

    .auth-divider {
      text-align: center;
      margin: 15px 0 5px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .strength-bar-container {
      background: #000;
      height: 6px;
      margin-top: 6px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(0, 244, 255, 0.1);
    }

    #strengthBar {
      width: 0%;
      height: 100%;
      transition: 0.3s;
    }

    .bg-weak {
      background: var(--danger) !important;
      box-shadow: 0 0 8px var(--danger);
    }

    .bg-medium {
      background: #ffaa00 !important;
      box-shadow: 0 0 8px #ffaa00;
    }

    .bg-strong {
      background: var(--accent-2) !important;
      box-shadow: 0 0 8px var(--accent-2);
    }

    #strengthText {
      margin-top: 4px;
      display: block;
      font-size: 11px;
    }

    /* ======== مخفی‌سازی کامل لودینگ پیش‌فرض گوگل ======== */
    .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
    .VIpgJd-ZVi9od-aZ2wEe-O16pdw,
    #goog-gt-tt,
    .goog-te-spinner-pos {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* ======== ساخت لودینگ اختصاصی نئونی سایت ======== */
    .custom-loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      /* پیش‌فرض مخفی است */
      justify-content: center;
      align-items: center;
      z-index: 99999;
      /* بالاتر از همه المان‌ها */
      flex-direction: column;
      gap: 20px;
    }

    .custom-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 244, 255, 0.1);
      border-left-color: var(--accent);
      /* رنگ نئونی اصلی */
      border-right-color: var(--accent-2);
      /* رنگ نئونی دوم */
      border-radius: 50%;
      animation: spinCustom 1s linear infinite;
      box-shadow: 0 0 20px rgba(0, 244, 255, 0.4);
    }

    .custom-loader-text {
      color: var(--accent);
      font-family: Vazirmatn, sans-serif;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 244, 255, 0.6);
    }

    @keyframes spinCustom {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* نوار بالای گوگل */
    .goog-te-banner-frame,
    .skiptranslate iframe {
      display: none !important;
    }

    body {
      top: 0 !important;
    }

    /* ویجت پیشفرض گوگل */
    .goog-te-gadget {
      display: none !important;
    }

    /* لوگوی گوگل */
    .goog-logo-link {
      display: none !important;
    }

    /* متن Powered by */
    .goog-te-gadget span {
      display: none !important;
    }

    /* کمبوباکس پیشفرض */
    .goog-te-combo {
      display: none !important;
    }

    /* پنجره Tooltip */
    #goog-gt-tt,
    .goog-tooltip,
    .goog-tooltip:hover,
    .goog-text-highlight {
      display: none !important;
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
    }

    body {
      top: 0 !important;
    }

    html {
      margin-top: 0 !important;
    }
  </style>
</head>

<body>

  <div class="auth-page-wrapper">
    <div class="auth-box panel">
      <h2>پایگاه احراز هویت GHOST</h2>

      <div class="field">
        <label>نام کاربری</label>
        <input type="text" id="authName" placeholder="نام خود را وارد کنید">
      </div>

      <div class="field">
        <label>ایمیل (بدون نیاز به @gmail.com)</label>
        <input type="text" id="authEmail" placeholder="username یا username@gmail.com">
      </div>

      <div class="field">
        <label>رمز عبور (حداقل ۸ رقم)</label>
        <input type="password" id="authPassword" placeholder="******" oninput="checkPasswordStrength(this.value)">
        <div class="strength-bar-container">
          <div id="strengthBar"></div>
        </div>
        <small id="strengthText"></small>
      </div>

      <div class="field">
        <label>تکرار رمز عبور</label>
        <input type="password" id="authConfirmPassword" placeholder="******">
      </div>

      <button class="btn" id="signUpBtn" onclick="handleSignUp()"><i class="fa-solid fa-fingerprint"></i> ایجاد حساب
        کاربری</button>

      <div class="auth-divider">یا</div>

      <button class="btn google-btn" id="googleBtn" onclick="handleGoogleSignIn()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
        ورود با حساب گوگل
      </button>
    </div>
  </div>

  <script src="global-translate.js"></script>
  <script src="alert-system.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  
    const firebaseConfig = {
      apiKey: "AIzaSyCKGR-kZpIowWukh8fnbr-hepGuXyZG3Vg",
      authDomain: "ghost-3151c.firebaseapp.com",
      projectId: "ghost-3151c",
      storageBucket: "ghost-3151c.firebasestorage.app",
      messagingSenderId: "538505756050",
      appId: "1:538505756050:web:1448b00baff4018cc4954b"
    };
  
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
  
    // کنترل بازگشت از ریدایرکت گوگل (مخصوص داخل تلگرام)
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const result = await getRedirectResult(auth);
        if (result && result.user) {
          const user = result.user;
          await handleUserFirestoreSetup(user, "کاربر گوگل", 100);
          window.location.replace("index.html");
        }
      } catch (error) {
        console.error("Redirect Auth Error:", error);
      }
    });
  
    // تابع کمکی برای ثبت دیتابیس جهت جلوگیری از تکرار کد
    async function handleUserFirestoreSetup(user, displayName, coins) {
      await setDoc(doc(db, "users", user.uid), {
        uid: user.uid,
        displayName: displayName,
        email: user.email,
        coins: coins,
        hackCount: 0,
        isBanned: false
      }, { merge: true });
    }
  
    // ۱. سیستم تشخیص قدرت پسورد نئونی
    function checkPasswordStrength(password) {
      const bar = document.getElementById("strengthBar");
      const text = document.getElementById("strengthText");
  
      if (!password) {
        bar.style.width = "0%";
        text.textContent = "";
        return;
      }
  
      let score = 0;
      if (password.length >= 8) score++;
      if (/[A-Z]/.test(password) || /[0-9]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;
  
      bar.className = "";
      if (score <= 1 || password.length < 8) {
        bar.style.width = "33%";
        bar.classList.add("bg-weak");
        text.textContent = "ضعیف ❌";
        text.style.color = "var(--danger)";
      } else if (score === 2) {
        bar.style.width = "66%";
        bar.classList.add("bg-medium");
        text.textContent = "متوسط ⚠️";
        text.style.color = "#ffaa00";
      } else if (score === 3) {
        bar.style.width = "100%";
        bar.classList.add("bg-strong");
        text.textContent = "امنیت گاد و فول نجومی! ✅";
        text.style.color = "var(--accent-2)";
      }
    }
  
    // ۳- تابع تغییر وضعیت لودینگ دکمه
    function setAuthLoading(isLoading, buttonId, originalText) {
      const btn = document.getElementById(buttonId);
      if (!btn) return;
      if (isLoading) {
        btn.disabled = true; // غیرفعال کردن دکمه برای جلوگیری از کلیک دوباره
        btn.style.pointerEvents = "none";
        btn.innerHTML = `<span style="display:inline-block; width:14px; height:14px; border:2px solid var(--text); border-top-color:transparent; border-radius:50%; animation:spinCustom 0.8s linear infinite; vertical-align:middle; margin-left:5px;"></span> در حال پردازش...`;
      } else {
        btn.disabled = false;
        btn.style.pointerEvents = "auto";
        btn.innerHTML = originalText;
      }
    }
  
    if (!document.getElementById('btnSpinStyle')) {
      const style = document.createElement('style');
      style.id = 'btnSpinStyle';
      style.innerHTML = `@keyframes spinCustom { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }`;
      document.head.appendChild(style);
    }
  
    // تابع اصلی ثبت نام
    async function handleSignUp() {
      const name = document.getElementById("authName").value.trim();
      let email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      const confirmPassword = document.getElementById("authConfirmPassword").value;
  
      if (!name || !email || !password) { alert("همه فیلدها رو پر کن دادا!"); return; }
      if (password !== confirmPassword) { alert("پسوردها با هم یکی نیستن!"); return; }
      if (password.length < 8) { alert("پسورد باید حداقل ۸ رقم باشه!"); return; }
  
      if (!email.includes("@")) email = email + "@gmail.com";
  
      setAuthLoading(true, "signUpBtn", "ایجاد حساب کاربری");
  
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await handleUserFirestoreSetup(userCredential.user, name, 10);
  
        alert("ثبت نام موفقیت‌آمیز بود! ۱۰ سکه هدیه گرفتی رئیس.");
        setTimeout(() => { window.location.replace("index.html"); }, 100);
  
      } catch (error) {
        // مدیریت هوشمند کلیک‌های همزمان یا ایمیل تکراری
        if (error.code === 'auth/email-already-in-use') {
          alert("این ایمیل قبلاً ثبت شده دادا! اگه اکانت داری وارد شو یا ایمیل رو عوض کن.");
        } else {
          alert("خطا در ثبت نام: " + error.message);
        }
        setAuthLoading(false, "signUpBtn", "ایجاد حساب کاربری");
      }
    }
  
    // تابع ورود با گوگل بهینه شده برای تلگرام
    async function handleGoogleSignIn() {
      setAuthLoading(true, "googleBtn", "ورود با حساب گوگل");
      
      // تشخیص اینکه کاربر داخل تلگرام یا مرورگرهای مشابه است
      const isWebView = /Telegram|FBAN|FBAV|Instagram/i.test(navigator.userAgent);
  
      if (isWebView) {
        // اگر داخل تلگرام بود، به جای پاپ‌آپ از ریدایرکت استفاده کن
        try {
          await signInWithRedirect(auth, googleProvider);
        } catch (error) {
          alert("خطا در هدایت به گوگل: " + error.message);
          setAuthLoading(false, "googleBtn", "ورود با حساب گوگل");
        }
      } else {
        // مرورگر عادی (کروم، فایرفاکس و...)
        try {
          const result = await signInWithPopup(auth, googleProvider);
          await handleUserFirestoreSetup(result.user, result.user.displayName || "کاربر گوگل", 100);
          alert("با اکانت گوگل با موفقیت وارد شدی دادا!");
          setTimeout(() => { window.location.replace("index.html"); }, 100);
        } catch (error) {
          // اگر پاپ آپ به هر دلیلی مسدود شد، سوییچ کن روی ریدایرکت
          if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request') {
            try {
              await signInWithRedirect(auth, googleProvider);
            } catch (reError) {
              alert("خطا در ورود با گوگل: " + reError.message);
              setAuthLoading(false, "googleBtn", "ورود با حساب گوگل");
            }
          } else {
            alert("خطای گوگل: " + error.message);
            setAuthLoading(false, "googleBtn", "ورود با حساب گوگل");
          }
        }
      }
    }
  
    window.checkPasswordStrength = checkPasswordStrength;
    window.handleSignUp = handleSignUp;
    window.handleGoogleSignIn = handleGoogleSignIn;
  </script>
</body>

</html>

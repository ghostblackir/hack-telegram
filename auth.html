<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHOST AUTH SYSTEMS</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #121212;
      --text: #e6e6e6;
      --accent: #00f4ff;
      --accent-2: #00ff95;
      --muted: #9aa0a6;
      --danger: #ff5252;
      --warning: #ffaa00;
      --border: #00f4ff33;
    }

    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #050505;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .auth-page-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      background: var(--panel);
      width: 100%;
      max-width: 420px;
      padding: 35px 30px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 244, 255, 0.05);
      position: relative;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 16px 16px 0 0;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      background: linear-gradient(45deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 8px 0;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      background: #181818;
      border: 1px solid #2a2a2a;
      padding: 12px 16px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(0, 244, 255, 0.1);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.3s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 25px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #2a2a2a;
    }

    .divider:not(:empty)::before {
      margin-left: .5em;
    }

    .divider:not(:empty)::after {
      margin-right: .5em;
    }

    .btn-google {
      width: 100%;
      background: #181818;
      color: #fff;
      border: 1px solid #2a2a2a;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.3s ease;
    }

    .btn-google:hover {
      background: #222;
    }

    .btn-google img {
      width: 18px;
      height: 18px;
    }

    .error-display {
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      line-height: 1.6;
    }

    .switch-mode-text {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    .switch-mode-text span {
      color: var(--accent);
      cursor: pointer;
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <h1 class="brand-title" id="authTitle">ثبت نام ZED EXE</h1>
        <p class="brand-subtitle" id="authSubtitle">به هسته مرکزی سرور GHOST متصل شوید</p>
      </div>

      <div id="errorBox" class="error-display"></div>

      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="form-group" id="usernameGroup">
          <label for="usernameField">نام کاربری (حداقل ۵ کاراکتر)</label>
          <div class="input-wrapper">
            <input type="text" id="usernameField" placeholder="مثال: clown_zed">
          </div>
        </div>

        <div class="form-group">
          <label for="emailField">آدرس ایمیل</label>
          <div class="input-wrapper">
            <input type="email" id="emailField" placeholder="example@gmail.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="passwordField">رمز عبور</label>
          <div class="input-wrapper">
            <input type="password" id="passwordField" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">ایجاد حساب کاربری</button>
      </form>

      <div class="divider">یا</div>

      <button id="googleBtn" class="btn-google" onclick="handleGoogleAuth()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
        <span id="googleBtnText">ورود با حساب گوگل</span>
      </button>

      <p class="switch-mode-text" id="switchModeWrapper">
        قبلاً ثبت نام کرده‌اید؟ <span onclick="toggleAuthMode('login')">وارد شوید</span>
      </p>
    </div>
  </div>

  <script src="alert-system.js"></script>
  <script type="module">
    import { 
      auth, 
      db, 
      createUserWithEmailAndPassword, 
      doc, 
      getDoc, 
      setDoc 
    } from "./firebase.js";

    import { 
      signInWithEmailAndPassword,
      signInWithPopup, 
      signInWithRedirect,
      GoogleAuthProvider 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import { 
      collection,
      query,
      where,
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const googleProvider = new GoogleAuthProvider();
    let isLoginMode = false;

    // مترجم فارسی ارورهای فایربیس
    function getPersianErrorMessage(errorCode) {
      switch (errorCode) {
        case 'auth/invalid-email':
          return 'آدرس ایمیل وارد شده معتبر نیست. لطفاً فرمت ایمیل را بررسی کنید.';
        case 'auth/user-disabled':
          return 'این حساب کاربری توسط مدیریت مسدود شده است.';
        case 'auth/user-not-found':
        case 'auth/invalid-credential':
          return 'ایمیل یا رمز عبور اشتباه است. لطفاً دوباره تلاش کنید.';
        case 'auth/wrong-password':
          return 'رمز عبور وارد شده اشتباه است.';
        case 'auth/email-already-in-use':
          return 'این آدرس ایمیل قبلاً ثبت نام کرده است! اگر اکانت دارید وارد شوید.';
        case 'auth/weak-password':
          return 'رمز عبور خیلی ضعیف است! حداقل باید ۶ کاراکتر باشد.';
        case 'auth/popup-blocked':
          return 'پاپ‌آپ مرورگر شما مسدود شده است. لطفاً اجازه دسترسی بدهید.';
        case 'auth/network-request-failed':
          return 'خطا در اتصال به شبکه! فیلترشکن (VPN) خود را روشن کنید.';
        default:
          return 'یک خطای غیرمنتظره رخ داد. لطفاً مجدداً تلاش کنید.';
      }
    }

    // تغییر وضعیت بین ورود و ثبت نام در ظاهر فرم
    window.toggleAuthMode = function(mode) {
      const authTitle = document.getElementById("authTitle");
      const authSubtitle = document.getElementById("authSubtitle");
      const usernameGroup = document.getElementById("usernameGroup");
      const submitBtn = document.getElementById("submitBtn");
      const switchModeWrapper = document.getElementById("switchModeWrapper");
      const errorBox = document.getElementById("errorBox");

      errorBox.style.display = "none";

      if (mode === 'login') {
        isLoginMode = true;
        authTitle.textContent = "ورود به ZED EXE";
        authSubtitle.textContent = "با مشخصات حساب خود وارد پنل شوید";
        usernameGroup.style.display = "none";
        submitBtn.textContent = "ورود به حساب کاربری";
        switchModeWrapper.innerHTML = `حساب کاربری ندارید؟ <span onclick="toggleAuthMode('signup')">ثبت نام کنید</span>`;
      } else {
        isLoginMode = false;
        authTitle.textContent = "ثبت نام ZED EXE";
        authSubtitle.textContent = "به هسته مرکزی سرور GHOST متصل شوید";
        usernameGroup.style.display = "block";
        submitBtn.textContent = "ایجاد حساب کاربری";
        switchModeWrapper.innerHTML = `قبلاً ثبت نام کرده‌اید؟ <span onclick="toggleAuthMode('login')">وارد شوید</span>`;
      }
    }

    // مدیریت وضعیت لودینگ دکمه‌ها
    function setAuthLoading(isLoading, btnId, originalText) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      if (isLoading) {
        btn.disabled = true;
        btn.textContent = "... در حال پردازش اطلاعات ...";
      } else {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    // راه اندازی سند کاربر در فایر استور
    async function handleUserFirestoreSetup(user, username, coinsAmount) {
      const userDocRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userDocRef);
      if (!userSnap.exists()) {
        await setDoc(userDocRef, {
          uid: user.uid,
          email: user.email,
          displayName: username,
          coins: coinsAmount,
          createdAt: new Date().toISOString()
        });
      }
    }

    // دکمه اصلی سابمیت فرم
    window.handleAuthSubmit = async function(event) {
      event.preventDefault();
      const errorBox = document.getElementById("errorBox");
      errorBox.style.display = "none";

      const email = document.getElementById("emailField").value.trim();
      const password = document.getElementById("passwordField").value.trim();
      const usernameInput = document.getElementById("usernameField").value.trim();

      if (isLoginMode) {
        // --- عملیات ورود ---
        setAuthLoading(true, "submitBtn", "ورود به حساب کاربری");
        try {
          const result = await signInWithEmailAndPassword(auth, email, password);
          const userDoc = await getDoc(doc(db, "users", result.user.uid));
          let currentName = result.user.displayName || "کاربر سیستم";
          if(userDoc.exists()) {
            currentName = userDoc.data().displayName || currentName;
          }
          alert(`خوش آمدی دادا ${currentName}! هدایت به پنل هک...`);
          setTimeout(() => { window.location.replace("index.html"); }, 100);
        } catch (error) {
          errorBox.textContent = getPersianErrorMessage(error.code);
          errorBox.style.display = "block";
          setAuthLoading(false, "submitBtn", "ورود به حساب کاربری");
        }
      } else {
        // --- عملیات ثبت نام ---
        // ۱. بررسی طول کاراکتر
        if (usernameInput.length < 5) {
          errorBox.textContent = "❌ خطای نام کاربری: نام کاربری باید حداقل ۵ کاراکتر باشد.";
          errorBox.style.display = "block";
          return;
        }

        // ۲. مسدود کردن کلمات لیست سیاه به صورت Case Insensitive
        const lowerUser = usernameInput.toLowerCase();
        if (lowerUser === 'ghost' || lowerUser === 'aqay ghost' || lowerUser === 'aqay_ghost') {
          errorBox.textContent = "❌ خطای امنیتی: انتخاب این نام کاربری به دلایل امنیتی قفل است!";
          errorBox.style.display = "block";
          return;
        }

        setAuthLoading(true, "submitBtn", "ایجاد حساب کاربری");

        try {
          // ۳. چک کردن تکراری نبودن نام کاربری در کل دیتابیس (با حفظ حساسیت حروف بزرگ و کوچک)
          const q = query(collection(db, "users"), where("displayName", "==", usernameInput));
          const querySnapshot = await getDocs(q);
          if (!querySnapshot.empty) {
            errorBox.textContent = `❌ نام کاربری "${usernameInput}" قبلاً توسط شخص دیگری رزرو شده است!`;
            errorBox.style.display = "block";
            setAuthLoading(false, "submitBtn", "ایجاد حساب کاربری");
            return;
          }

          // ۴. ایجاد اکانت در سیستم احراز هویت
          const result = await createUserWithEmailAndPassword(auth, email, password);
          await handleUserFirestoreSetup(result.user, usernameInput, 10);
          alert("حساب کاربری شما با موفقیت در هسته ZED EXE ثبت شد!");
          setTimeout(() => { window.location.replace("index.html"); }, 100);

        } catch (error) {
          errorBox.textContent = getPersianErrorMessage(error.code);
          errorBox.style.display = "block";
          setAuthLoading(false, "submitBtn", "ایجاد حساب کاربری");
        }
      }
    };

    // ورود از طریق گوگل
    window.handleGoogleAuth = async function() {
      setAuthLoading(true, "googleBtn", "ورود با حساب گوگل");
      const isWebView = /Telegram|FBAN|FBAV|Instagram/i.test(navigator.userAgent);

      if (isWebView) {
        try {
          await signInWithRedirect(auth, googleProvider);
        } catch (error) {
          document.getElementById("errorBox").textContent = "خطا در هدایت به گوگل: " + getPersianErrorMessage(error.code);
          document.getElementById("errorBox").style.display = "block";
          setAuthLoading(false, "googleBtn", "ورود با حساب گوگل");
        }
      } else {
        try {
          const result = await signInWithPopup(auth, googleProvider);
          await handleUserFirestoreSetup(result.user, result.user.displayName || "کاربر گوگل", 10);
          alert("با اکانت گوگل با موفقیت وارد شدی دادا!");
          setTimeout(() => { window.location.replace("index.html"); }, 100);
        } catch (error) {
          if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request') {
            try {
              await signInWithRedirect(auth, googleProvider);
            } catch (reError) {
              document.getElementById("errorBox").textContent = getPersianErrorMessage(reError.code);
              document.getElementById("errorBox").style.display = "block";
              setAuthLoading(false, "googleBtn", "ورود با حساب گوگل");
            }
          } else {
            document.getElementById("errorBox").textContent = getPersianErrorMessage(error.code);
            document.getElementById("errorBox").style.display = "block";
            setAuthLoading(false, "googleBtn", "ورود با حساب گوگل");
          }
        }
      }
    };
  </script>
</body>
</html>
